<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>教師控制台｜課堂搶答</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; color: #172033; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px 16px; }
    main { width: min(100%, 680px); margin: 0 auto; }
    h1 { font-size: clamp(1.7rem, 6vw, 2.2rem); }
    .notice, .warning, .panel { padding: 18px; border-radius: 16px; }
    .notice { color: #18376f; background: #e8efff; line-height: 1.6; }
    .warning { margin-top: 12px; color: #7d1c13; background: #ffe4df; font-weight: 800; }
    .panel { margin-top: 18px; background: white; box-shadow: 0 8px 28px #17203312; }
    label { display: block; margin: 12px 0 8px; font-weight: 700; }
    input { width: 100%; min-height: 52px; padding: 10px 12px; border: 1px solid #aab5c8; border-radius: 10px; font: inherit; font-size: 1rem; }
    button { min-height: 52px; width: 100%; margin-top: 12px; padding: 12px 16px; border: 0; border-radius: 12px; color: white; background: #2357d8; font: inherit; font-weight: 750; font-size: 1rem; touch-action: manipulation; }
    button:disabled { opacity: .55; }
    .group-list { display: grid; gap: 12px; margin-top: 12px; }
    .message { min-height: 1.5em; color: #a12626; line-height: 1.5; }
    h2 { margin: 0 0 8px; font-size: 1.3rem; }
    h3 { margin: 18px 0 8px; font-size: 1.1rem; }
    .status { margin: 8px 0; padding: 12px; border-radius: 10px; background: #eef2f8; line-height: 1.5; }
    .divider { margin: 18px 0 0; color: #5a6680; font-weight: 700; }
    input[type="file"] { padding: 12px; background: #fbfcfe; }
    button.secondary { color: #2357d8; background: #e8efff; }
    .summary ul { margin: 0; padding-left: 1.2em; line-height: 1.7; }
    .summary .warnings { color: #7d4a00; }
    .table-wrap { margin-top: 12px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #dde3ee; text-align: left; white-space: nowrap; }
    th { background: #f4f7fb; }
    [hidden] { display: none !important; }
    .summary-grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 12px 0 0; }
    .summary-grid dt { color: #5a6680; font-weight: 700; }
    .summary-grid dd { margin: 0; font-weight: 800; }
    #summary-phase { font-size: 1.4rem; }
    button.danger { background: #b42318; }
    .confirm { margin-top: 12px; padding: 12px; border-radius: 12px; background: #fff3f0; }
    .confirm p { margin: 0; color: #7d1c13; font-weight: 700; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .header button { width: auto; margin-top: 0; min-height: 44px; }
    .message.ok { color: #1d6b3a; }
  </style>
</head>
<body>
  <main>
    <div class="header">
      <h1>教師控制台</h1>
      <button id="logout" type="button" class="secondary" hidden>登出</button>
    </div>

    <p id="checking-view" class="status">讀取中…</p>

    <section id="not-configured-view" class="panel" hidden>
      <h2>需要先設定老師密碼</h2>
      <p class="notice">server 尚未設定老師密碼，目前無法登入。請在專案根目錄把 <code>.env.example</code> 複製成 <code>.env</code>，將 <code>TEACHER_PASSWORD</code> 改成自己的密碼，再重新啟動 server。</p>
    </section>

    <section id="login-view" class="panel" hidden>
      <h2>老師登入</h2>
      <form id="login-form">
        <label for="password">老師密碼</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button id="login-submit" type="submit">登入</button>
      </form>
      <p id="login-message" class="message" role="alert" aria-live="assertive"></p>
    </section>

    <div id="console-view" hidden>
      <section class="panel" aria-labelledby="session-title">
        <h2 id="session-title">活動狀態</h2>
        <dl class="summary-grid">
          <dt>階段</dt><dd id="summary-phase" aria-live="polite">讀取中…</dd>
          <dt>組別與題目</dt><dd id="summary-counts"></dd>
        </dl>
        <button id="start" type="button">開始搶答</button>
        <button id="end" type="button" class="danger">結束搶答</button>
        <div id="end-confirm" class="confirm" hidden>
          <p>確定要結束搶答嗎？結束後學生無法再送出，也不能重新開始。</p>
          <button id="end-confirm-yes" type="button" class="danger">確認結束</button>
          <button id="end-confirm-no" type="button" class="secondary">取消</button>
        </div>
        <p id="session-message" class="message" role="status" aria-live="polite"></p>
      </section>

    <section class="panel" aria-labelledby="groups-title">
      <h2 id="groups-title">組別設定</h2>
      <p id="groups-blocked" class="warning" role="alert" hidden></p>
      <label for="group-count">組數（1 到 100）</label>
      <input id="group-count" type="number" min="1" max="100" step="1" value="5">
      <button id="generate" type="button">一鍵產生</button>
      <div id="group-list" class="group-list" aria-live="polite"></div>
      <button id="apply" type="button">套用組別</button>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>
    <section class="panel" aria-labelledby="import-title">
      <h2 id="import-title">匯入學習單</h2>
      <p id="import-current" class="status">讀取中…</p>
      <p id="import-blocked" class="warning" role="alert" hidden></p>
      <label for="import-file">上傳 xlsx 檔（5 MiB 以內）</label>
      <input id="import-file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
      <button id="import-upload" type="button">讀取檔案</button>
      <p class="divider">或</p>
      <label for="import-link">貼上 Google 試算表連結（需設為「知道連結者可檢視」）</label>
      <input id="import-link" type="url" inputmode="url" placeholder="https://docs.google.com/spreadsheets/d/...">
      <button id="import-link-submit" type="button">讀取連結</button>
      <div id="import-summary" class="summary" hidden>
        <h3>請核對匯入內容</h3>
        <ul id="import-summary-lines"></ul>
        <ul id="import-warnings" class="warnings"></ul>
        <div class="table-wrap">
          <table>
            <thead><tr><th>題號</th><th>類型</th><th>空格</th><th>前綴</th></tr></thead>
            <tbody id="import-rows"></tbody>
          </table>
        </div>
        <button id="import-confirm" type="button">確認匯入</button>
        <button id="import-cancel" type="button" class="secondary">取消</button>
      </div>
      <p id="import-message" class="message" role="status" aria-live="polite"></p>
    </section>

    <section class="panel" aria-labelledby="export-title">
      <h2 id="export-title">匯出結果</h2>
      <p id="export-description" class="status">活動結束後才能匯出。</p>
      <button id="export-writeback" type="button" disabled>寫回 Google 試算表</button>
      <button id="export-download" type="button" class="secondary" disabled>下載 xlsx</button>
      <p id="export-message" class="message" role="status" aria-live="polite"></p>
    </section>
    </div>
  </main>
  <script type="module" src="/teacher/app.js"></script>
</body>
</html>
