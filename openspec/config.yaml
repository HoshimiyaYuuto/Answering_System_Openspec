schema: spec-driven

context: |
  Language: zh-TW
  All artifacts must be written in zh-TW.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  專案：課堂搶答系統（NCU 軟體工程期末專題，OpenSpec 組）。老師匯入 Guided Notes（填空學習單），
  學生以組別為單位在各自裝置上每題搶答，server 收到順序最快者為該題成功答案，結束後匯出寫回
  Guided Notes。系統不判斷答案對錯。
  需求來源：docs/explore-summary.md（第 0 節為工作規則）。API 契約：docs/api-contract.md。
  技術：Node.js + Express（REST）+ SSE。狀態存記憶體。前端為 public/student 與 public/teacher 的
  輕量網頁，只用原生 HTML、CSS、JavaScript，不引入重型框架（除非 design 說明理由）。本機運作，可由同網段裝置連線。
  慣例：
  - 階段值固定為「準備中」「搶答中」「已結束」，一律從 docs/api-contract.md 複製，不得自訂。
  - API 回應皆為 JSON。成功為 {"data": ...}，錯誤為 {"error":{"code","message"}}。
  - 時間一律由 server 產生，使用 ISO 8601 UTC。
  - 密碼與金鑰只放 .env，repo 只放不含真值的 .env.example。
  - 老師端點（組別設定、匯入、階段控制等）須老師登入，未登入回 401 TEACHER_AUTH_REQUIRED；新增老師端點時沿用 requireTeacher，不再以 loopback 判斷權限。
  - 程式識別字與 capability 名稱用英文。
  - 已存在的能力名稱為 api-contract-and-session-lifecycle 與 groups-and-entry。修改它們時用 MODIFIED，名稱須一字不差。
  - 開發用種子與測試路由只在 NODE_ENV 為 development 時啟用，未設定視為 production。
  - 前端更新畫面一律以取代內容（replaceChildren 或 textContent），不得累加。同一資料來源可能被同時請求多次時，必須丟棄過期的回應。

rules:
  proposal:
    - 只涵蓋指定的一個 change，不得加入範圍外的功能。
    - 註明對應 docs/explore-summary.md 的哪些章節。
    - 每個 change 只屬於一位負責人。若功能橫跨學生端與教師端，拆成兩個 change，並在 Impact 註明依賴的另一個 change。
  specs:
    - 每個 Requirement 使用 SHALL，且至少有一個 Scenario。
    - 修改既有能力用 MODIFIED，標題須與主規格完全一致，並寫出修改後的完整內容。
    - 新增或修改 API 端點時，須同步更新 docs/api-contract.md。
  design:
    - 列出替代方案與取捨，並說明與 docs/api-contract.md 的一致性。
    - 不得出現真實密碼或金鑰。
    - 涉及前端畫面的 change，design 須列出畫面狀態機，包含有哪些畫面、各畫面由什麼資料決定、哪些事件會切換畫面。
  tasks:
    - 每個 task 一次只動 1 到 2 個檔案，並附上驗證方式。
    - 驗證須包含自動測試，以及可手動執行的指令。
    - 一個 change 的 tasks 全部由同一位負責人完成，不在 tasks 內標註分給不同人。
    - 前端 task 的手動驗證須列出瀏覽器操作步驟，並以不同來源（localhost、127.0.0.1、區網 IP）模擬多位學生。

operations:
  apply:
    guidance:
      - 只做指定的 tasks，驗證通過才打勾。
      - 實作與契約不一致時先停下回報，不要自行修改契約。
      - 完成後簡短列出改動的檔案與執行過的驗證指令。
  archive:
    guidance:
      - 已同步的 delta spec 不重複同步。
      - 結束前簡述歸檔結果。