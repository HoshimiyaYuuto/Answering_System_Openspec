<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>學生選組｜課堂搶答</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; color: #172033; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px 16px; }
    main { width: min(100%, 560px); margin: 0 auto; }
    h1 { margin: 8px 0 24px; font-size: clamp(1.8rem, 7vw, 2.4rem); }
    .card { padding: 24px; border-radius: 20px; background: white; box-shadow: 0 8px 28px #17203312; }
    .group-list { display: grid; gap: 12px; margin-top: 16px; }
    .question-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 12px; margin-top: 16px; }
    .question-grid button { min-height: 44px; padding: 10px 12px; font-size: 1rem; }
    .answer-input { display: block; width: 100%; min-height: 44px; margin: 8px 0 16px; padding: 10px 12px; border: 1px solid #aab5c8; border-radius: 10px; font: inherit; }
    button { min-height: 56px; width: 100%; padding: 14px 18px; border: 0; border-radius: 14px; color: white; background: #2357d8; font: inherit; font-size: 1.1rem; font-weight: 700; cursor: pointer; touch-action: manipulation; }
    button:disabled { opacity: .6; cursor: wait; }
    .secondary { margin-top: 16px; color: #17366f; background: #e8efff; }
    .message { min-height: 1.6em; color: #a12626; line-height: 1.5; }
    .hint { color: #4b5870; line-height: 1.6; }
    .countdown { margin: 0 0 12px; padding: 10px 14px; border-radius: 12px; color: #18376f; background: #e8efff; font-weight: 800; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>課堂搶答</h1>
    <section id="selection" class="card" aria-labelledby="selection-title">
      <h2 id="selection-title">選擇組別</h2>
      <p id="status" class="message" role="status" aria-live="polite"></p>
      <div id="groups" class="group-list"></div>
      <button id="refresh" class="secondary" type="button" hidden>重新整理</button>
    </section>
    <section id="waiting" class="card" hidden aria-labelledby="waiting-title">
      <h2 id="waiting-title">等待活動</h2>
      <p>你的組別：<strong id="group-name"></strong></p>
      <p id="phase-text" class="hint" aria-live="polite"></p>
    </section>
    <section id="answering" class="card" hidden aria-labelledby="answering-title">
      <h2 id="answering-title">題目</h2>
      <p id="countdown" class="countdown" aria-live="off" hidden></p>
      <p id="answering-message" class="message" role="status" aria-live="polite" hidden></p>
      <button id="retry-questions" class="secondary" type="button" hidden>重試</button>
      <div id="question-grid" class="question-grid" aria-label="題號" hidden></div>
      <div id="question-page" hidden></div>
    </section>
    <section id="ended" class="card" hidden aria-labelledby="ended-title">
      <h2 id="ended-title">活動已結束</h2>
      <section id="results-section" hidden aria-label="活動結果">
        <p id="results-summary" hidden></p>
        <p id="results-fair-ranking" class="hint" hidden></p>
        <ul id="results-list" hidden></ul>
        <p id="results-loading" class="hint" aria-live="polite" hidden>正在載入結果…</p>
        <p id="results-error" class="message" role="status" aria-live="polite" hidden></p>
        <button id="results-retry" class="secondary" type="button" hidden>重試</button>
      </section>
    </section>
  </main>
  <script type="module" src="/student/app.js"></script>
</body>
</html>
